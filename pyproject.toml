[project]
name = "jarvis-bmos"
version = "0.5.0"
description = "local virtual assistant mimicing jarvis and BMO"
authors = [
    {name = "Tristan Golden"}
]
# readme = "README.md"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pydantic (>=2.11.7,<3.0.0)",
    "openai (>=1.91.0,<2.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "uuid (>=1.30,<2.0)",
    "icalendar (>=6.3.1,<7.0.0)",
    "datetime (>=5.5,<6.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "deepgram-sdk (>=4.3.1,<5.0.0)",
    "elevenlabs (>=2.5.0,<3.0.0)",
    "sounddevice (>=0.5.2,<0.6.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "numpy (>=1.26,<2.0)",
    "scipy (>=1.11,<2.0)",
    "gpiozero (>=2.0.1,<3.0.0)",
    "pydub (>=0.25.1,<0.26.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "webrtcvad (>=2.0.10,<3.0.0)",
    "torch (>=2.7.1,<3.0.0)",
    "openai-whisper (>=20250625,<20250626)",
    "nltk (>=3.9.1,<4.0.0)",
    "pygame-ce (>=2.5.5,<3.0.0)",
    "flask (>=3.1.2,<4.0.0)",
    "wit (>=6.0.1,<7.0.0)",
    "num2words (>=0.5.14,<0.6.0)",
    "gruut (>=2.4.0,<3.0.0)",
    "gruut-ipa (>=0.13.0,<0.14.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "g2p-en (>=2.1.0,<3.0.0)",
    "phonemizer (>=3.3.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
